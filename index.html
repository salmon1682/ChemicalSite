<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>반도체 고장 실험실</title><style>
*{box-sizing:border-box}body{margin:0;background:#080d19;color:#f1f6ff;font:16px/1.65 system-ui,sans-serif}main{width:min(760px,94%);margin:36px auto}small{color:#7cf5da;letter-spacing:.14em;font-weight:700}h1{font-size:clamp(30px,6vw,52px);margin:5px 0}p{color:#becbe0}canvas{display:block;width:100%;aspect-ratio:2/1;background:radial-gradient(ellipse,#182c48,#0b1223);border:1px solid #324965;border-radius:16px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{background:#172539;color:#fff;border:1px solid #526b87;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}button:hover,button:focus-visible{border-color:#7cf5da}#result{padding:16px;background:#131f31;border-radius:12px;min-height:100px}strong{color:#ffd08a}footer{color:#becbe0;font-size:14px}</style>
<main><small>CHEMISTRY DEMO · 교육용 연출</small><h1>반도체 고장 실험실</h1><p>규소 칩에 불순물을 넣거나, 칩의 소재를 다른 반도체로 바꿔 보세요. 두 실험은 결과가 다릅니다.</p><canvas id="scene" width="760" height="380" role="img" aria-label="규소 칩과 고장을 나타내는 만화 효과"></canvas><nav id="controls" aria-label="불순물 선택"><button data-id="Na">나트륨 Na 투입</button><button data-id="Fe">철 Fe 투입</button><button data-id="Cu">구리 Cu 투입</button><button data-id="Ge">게르마늄 Ge로 교체</button><button data-id="GaN">질화갈륨 GaN으로 교체</button><button id="reset">정상 상태로</button></nav><p id="result" role="status">정상 작동 · 불순물 투입 또는 반도체 소재 교체를 선택하세요.</p><footer>⚠️ 폭발은 고장을 표현한 가상의 효과입니다. 불순물이 들어간다고 칩이 폭발하는 것은 아닙니다. 영향은 위치와 농도에 따라 달라지며, 구리는 절연·차단 구조를 갖춘 배선 재료로도 사용됩니다.</footer></main>
<script>
const data={Ge:['게르마늄','게르마늄도 반도체입니다. 규소보다 밴드갭이 작아 열로 전자와 정공이 더 쉽게 생깁니다. 소재에 맞는 설계가 필요하며, 광통신용 검출기 등에 쓰입니다.'],GaN:['질화갈륨','갈륨과 질소로 이루어진 화합물 반도체입니다. 규소보다 밴드갭이 크고, 소재에 맞게 설계하면 청색 LED나 고속 전력 소자에 활용할 수 있습니다.'],Na:['나트륨','산화막 속 나트륨 이온이 전기장에 따라 움직이면 트랜지스터가 켜지는 전압이 달라질 수 있습니다.'],Fe:['철','규소 내부의 철 불순물은 전자와 정공이 더 쉽게 재결합하게 해, 예를 들어 태양전지 효율을 낮출 수 있습니다.'],Cu:['구리','배선 밖으로 빠져나와 규소 내부로 확산된 구리는 소자의 누설 전류를 늘릴 수 있습니다.']};
const g=document.querySelector('canvas').getContext('2d'),out=document.getElementById('result'),reduce=matchMedia('(prefers-reduced-motion: reduce)');const swap=()=>id==='Ge'||id==='GaN';let id='',start=0,particles=[],frame=0;
function text(s,x,y,c,size){g.fillStyle=c;g.textAlign='center';g.font=`bold ${size}px system-ui`;g.fillText(s,x,y);}
function draw(now){const t=reduce.matches&&id?2.5:Math.max(0,(now-start)/1000),done=id&&t>=.48,bad=done&&!swap(),good=done&&swap();g.clearRect(0,0,760,380);g.strokeStyle='#283b55';for(let x=20;x<760;x+=24){g.beginPath();g.moveTo(x,0);g.lineTo(x,380);g.stroke()}for(let y=10;y<380;y+=24){g.beginPath();g.moveTo(0,y);g.lineTo(760,y);g.stroke()}g.strokeStyle=bad?'#9a5244':'#63f5cf';g.lineWidth=3;for(let i=0;i<6;i++){for(const side of [-1,1]){g.beginPath();g.moveTo(380+side*90,135+i*22);g.lineTo(380+side*125,135+i*22);g.stroke();}}g.fillStyle=bad?'#382532':'#183940';g.fillRect(290,112,180,156);g.strokeRect(290,112,180,156);text(bad?'고장':good?id:'Si',380,198,bad?'#ffb086':'#a6ffeb',42);text(bad?'FAULT':good?'소재 교체 완료':'정상 작동',380,230,bad?'#ffb086':'#a6ffeb',17);
if(id&&!done){const x=105+275*t/.48;text(id,x,171,'#f7d37a',32);}if(bad&&t<2.4){const d=t-.48;
const halo=g.createRadialGradient(380,174,4,380,174,Math.max(12,95+370*d));halo.addColorStop(0,'#fff7c8');halo.addColorStop(.28,'#ffb43b');halo.addColorStop(.64,'#fa592f');halo.addColorStop(1,'#ff482000');g.globalAlpha=Math.max(0,1-d/1.15)*.9;g.fillStyle=halo;g.fillRect(0,0,760,380);
g.globalAlpha=Math.max(0,1-d/1.25)*.85;g.strokeStyle='#ffbf66';g.lineWidth=9;g.beginPath();g.ellipse(380,174,18+d*530,12+d*300,0,0,Math.PI*2);g.stroke();
g.globalAlpha=Math.max(0,1-d/1.92)*.36;for(let i=0;i<9;i++){g.fillStyle=i%2?'#5f5065':'#85707a';g.beginPath();g.arc(380+Math.cos(i*2.4)*(26+d*99),174+Math.sin(i*2.4)*(15+d*61)-d*42,28+d*30,0,Math.PI*2);g.fill();}
g.globalAlpha=Math.max(0,1-d/1.5);for(const [vx,vy,r,c] of particles){g.fillStyle=c;g.beginPath();g.arc(380+vx*d,174+vy*d+85*d*d,r,0,Math.PI*2);g.fill();}g.globalAlpha=1;}g.lineWidth=1;if(id&&t<2.4&&!reduce.matches)frame=requestAnimationFrame(draw);}
document.getElementById('controls').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cancelAnimationFrame(frame);id=b.dataset.id||'';start=performance.now();particles=Array.from({length:112},(_,i)=>{const a=i*2.39996,s=95+Math.random()*480;return[Math.cos(a)*s,Math.sin(a)*s,2+Math.random()*8,['#ffae56','#ff785b','#ffdd85'][i%3]]});out.replaceChildren();if(id){const title=document.createElement('strong');title.textContent=`${data[id][0]}(${id}) · ${swap()?"반도체 소재 교체":"오염으로 인한 고장 연출"}`;out.append(title,document.createElement('br'),data[id][1]);}else out.textContent='정상 작동 · 불순물 투입 또는 반도체 소재 교체를 선택하세요.';draw(start);});draw(0);
</script></html>
